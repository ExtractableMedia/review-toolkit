name: Validate

on: # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a pull request run is right; superseding a push to the default branch is not.
  # `claude plugin marketplace add` installs from that branch rather than a release artifact, so
  # every commit on it needs a validation record of its own — a cancelled conclusion is not a
  # passing one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor exercises README's "v2.1.145 or later" claim, which was otherwise an untested
        # assertion; latest gives early warning when a CLI release changes what --strict accepts.
        claude-version: ['2.1.145', 'latest']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Node is only needed to install the Claude Code CLI below, so track whatever the current
          # LTS is. Dependabot bumps the action itself but never this input, so a pinned major would
          # sit here until someone noticed it had gone end-of-life.
          node-version: 'lts/*'

      - name: Install Claude Code
        # Version comes from the matrix because this is a `run:` argument, which Dependabot's
        # github-actions ecosystem cannot see. --ignore-scripts blocks lifecycle scripts across the
        # whole dependency tree; this package genuinely needs its own postinstall to fetch the
        # native binary, so run exactly that one afterwards rather than trusting every transitive
        # package's. Installing with --ignore-scripts alone leaves a CLI that errors with "native
        # binary not installed".
        run: |
          npm install -g --ignore-scripts "@anthropic-ai/claude-code@${{ matrix.claude-version }}"
          node "$(npm root -g)/@anthropic-ai/claude-code/install.cjs"
          claude --version

      - name: Validate marketplace manifest
        run: claude plugin validate . --strict

      # `claude plugin validate` checks whichever manifest it finds first, and marketplace.json
      # wins. Validate the plugin manifest and component frontmatter from a copy that doesn't have
      # one.
      - name: Validate plugin manifest
        run: |
          # Copy the whole tree rather than naming component directories: a hand-kept list is a
          # second manifest of the layout that nothing checks, and validating a subset still passes,
          # so an omission is invisible.
          dest="$RUNNER_TEMP/plugin-check"
          rsync -a --exclude .git/ ./ "$dest/"
          # CLAUDE.md goes with it: --strict warns that a root CLAUDE.md is never loaded for the
          # people who install the plugin. That is true, and not a defect in a file written for
          # contributors to this repository — but leaving it in place fails the step, and dropping
          # --strict to get past it would accept every future warning too.
          rm "$dest/.claude-plugin/marketplace.json" "$dest/CLAUDE.md"
          claude plugin validate "$dest" --strict

      - name: Check bundled scripts are executable
        run: |
          # nullglob so a stale path reports as a stale glob rather than running the loop once on
          # the literal pattern and blaming the filesystem. .claude/hooks is named literally: bash
          # `**` does not match a leading dot without dotglob, so a wildcard would silently skip it,
          # and a hook that has lost the bit cannot exec — exit 126 is neither 0 nor 2, so it
          # reaches neither the user nor the model and linting simply stops.
          shopt -s nullglob globstar
          status=0
          for pattern in 'skills/**/*.sh' 'examples/**/*.sh' 'scripts/**/*.sh' '.claude/hooks/*.sh'; do
            # Per-glob rather than one pooled array: pooled, the guard can only fire when every
            # directory empties at once, which is no guard at all.
            eval "scripts=($pattern)"
            [ ${#scripts[@]} -gt 0 ] || { echo "No .sh files matched $pattern — the glob is stale"; status=1; }
            for f in "${scripts[@]}"; do
              test -x "$f" || { echo "Not executable: $f"; status=1; }
            done
          done
          exit $status

      - name: Referenced paths resolve
        run: |
          # A wrong path inside a skill body is invisible to markdownlint and to `plugin validate`,
          # and only surfaces when a review run loses its format spec. skills/doc-review/SKILL.md
          # calls this the check most worth spending time on; apply it to ourselves.
          status=0
          while IFS=: read -r file _ ref; do
            dir=$(dirname "$file")
            target="${ref/\$\{CLAUDE_SKILL_DIR\}/$dir}"
            [ -e "$target" ] || { echo "Dangling reference in $file: $ref"; status=1; }
          done < <(grep -rnoE '\$\{CLAUDE_SKILL_DIR\}[^`]*' skills/)
          exit $status

      - name: Skills are user-invoked only
        run: |
          # disable-model-invocation is what keeps Claude from fanning out three subagents across a
          # branch on its own. --strict checks that frontmatter is valid, not that this field is
          # present.
          status=0
          for f in skills/*/SKILL.md; do
            grep -q '^disable-model-invocation: true$' "$f" \
              || { echo "Missing disable-model-invocation in $f"; status=1; }
          done
          exit $status

      - name: Sample review conforms to the finding format
        # The golden sample is the only worked example of the format, and it had already drifted
        # from the spec once before anyone noticed.
        run: scripts/check-finding-format.sh examples/sample-review.md

      - name: Triage hook never blocks
        run: |
          # The hook's whole contract is that it observes without blocking: a non-zero exit from a
          # PostToolUse hook surfaces to the user mid-triage. Every failure path must still exit 0,
          # including ones that log nothing.
          fixtures=(
            '{"tool_input":{"questions":[{"header":"F1","question":"Fix F1?"}]}}'
            '{"tool_input":{"questions":[{"header":"Ship","question":"Deploy?"}]}}'
            'not json'
            ''
          )
          status=0
          for f in "${fixtures[@]}"; do
            printf '%s' "$f" | HOME="$(mktemp -d)" examples/hooks/log-triage-decisions.sh \
              || { echo "Hook exited non-zero on: ${f:-<empty>}"; status=1; }
          done
          # HOME unset is its own path: it aborts before any guard under `set -u` unless explicitly
          # handled.
          printf '%s' "${fixtures[0]}" | env -u HOME examples/hooks/log-triage-decisions.sh \
            || { echo "Hook exited non-zero with HOME unset"; status=1; }
          exit $status

      - name: Markdown hook blocks on an offense and stays quiet otherwise
        run: |
          # Every guard in the hook is `|| exit 0`, which is the right discipline and also means a
          # hook that has stopped working produces exactly what a hook that found nothing produces:
          # silence. The first fixture is the only one that tells those apart, which is why
          # markdownlint is installed here rather than the inert paths being asserted alone.
          npm install -g markdownlint-cli
          hook=.claude/hooks/lint-markdown.sh
          payload() { printf '{"tool_input":{"file_path":"%s"}}' "$1"; }
          status=0
          # `|| got=$?` rather than a bare call then `$?`: this step runs under `bash -e`, where a
          # command that exits non-zero outside a condition context kills the whole step — and the
          # first fixture is meant to exit 2.
          expect() {
            local want=$1 desc=$2 input=$3 got=0
            printf '%s' "$input" | CLAUDE_PROJECT_DIR="$PWD" "$hook" >/dev/null 2>&1 || got=$?
            [ "$got" = "$want" ] || { echo "$desc: expected $want, got $got"; status=1; }
          }

          # A long line with somewhere to wrap. MD013 exempts one with no whitespace to break at, so
          # a row of identical characters passes the linter and would prove nothing here.
          python3 -c "open('ci-dirty.md','w').write('# T\n\n' + ' '.join(['word']*40) + '\n')"
          printf '# T\n\nShort enough.\n' > ci-clean.md

          expect 2 "offending file must block"         "$(payload "$PWD/ci-dirty.md")"
          expect 0 "clean file must pass"              "$(payload "$PWD/ci-clean.md")"
          expect 0 "non-Markdown file is not ours"     "$(payload "$PWD/ci-clean.txt")"
          expect 0 "file outside the root is not ours" "$(payload "/tmp/ci-outside.md")"
          expect 0 "payload without file_path"         '{"tool_input":{}}'
          expect 0 "unparseable payload"               'not json'
          expect 0 "empty payload"                     ''

          # The documented inert contract: no linter, no linting, no complaint. PATH is cut back to
          # the system directories, which still hold jq but not npm's global bin. The other inert
          # path — no jq — cannot be reached this way, because the script looks for /usr/bin/jq by
          # absolute path first and every runner has it. That one stays unexercised, deliberately
          # and visibly rather than by omission.
          printf '%s' "$(payload "$PWD/ci-dirty.md")" \
            | PATH=/usr/bin:/bin CLAUDE_PROJECT_DIR="$PWD" "$hook" >/dev/null 2>&1 \
            || { echo "Hook blocked with markdownlint off PATH"; status=1; }

          # Diagnostics must reach stderr: exit 2 is what hands stderr back to Claude, while stdout
          # is transcript-only, so a message there reports that something is wrong without ever
          # reporting what.
          # `|| true` for the same reason: under `bash -e` an assignment from a failing command
          # substitution ends the step, and this one is expected to fail.
          err=$(printf '%s' "$(payload "$PWD/ci-dirty.md")" \
            | CLAUDE_PROJECT_DIR="$PWD" "$hook" 2>&1 >/dev/null) || true
          case "$err" in
            *MD013*) ;;
            *) echo "Blocking path put no rule id on stderr: $err"; status=1 ;;
          esac

          rm -f ci-dirty.md ci-clean.md
          exit $status

      - name: Reviewers use the resolved base, not a hardcoded one
        run: |
          # /local-review resolves the base branch once and passes each reviewer an explicit range.
          # A hardcoded main...HEAD in an agent or skill silently reviews the wrong code on a
          # master/develop/trunk repository, and reports it clean.
          if grep -rnE '\b(main|master)\.\.\.?HEAD' agents/ skills/; then
            echo "Hardcoded base branch above — use the range /local-review passes in."
            exit 1
          fi
